# JAX version of train_mss_log_micro.yml, for scripts/train.py
seed_everything: 420

custom:
  project_name: venturi  # The wandb project
  use_wandb_gpu: online   # wandb mode on GPU: online, offline, or disabled (or true / false)
  use_wandb_cpu: offline  # wandb mode on CPU, e.g. locally (the WANDB_MODE env var overrides both)
  model_name: mss_rev_724k_adamw_1e-4t5
  dataset_name: mars_808_n681_b8_micro
  cpu_batch_size: 8
  is_deterministic: true

trainer:
  devices: [0]
  max_epochs: 50
  accumulate_grad_batches: 1
  log_every_n_steps: 50           # how often training losses are copied to the host
  n_val_audio: 5                  # val items logged to wandb (audio and plots) every epoch

data:
  class_path: src.experiments.data_jax.WavDataModule
  init_args:
    batch_size: 8
    root_dir: data/808_dataset  # relative to the repository root
    sr: 44100
    n_samples: 44100
    n_train: 425
    n_val: 128
    n_test: 128
    n_delta_per_item: 1
    delta_min: 0
    delta_max: 0
    shuffle_seed: 0

# The trainable model
model: spectral_2dcnn_14p_jax.yml

# The fixed parts of the objective (the model.init_args of the PyTorch config, minus
# the model): called as loss(model, x, delta, key=key)
loss:
  class_path: src.experiments.losses_jax.DDSP808Loss
  init_args:
    synth: synth_jax.yml
#    loss_func: mss_meso_log_jax.yml
    loss_func: mss_revisited_jax.yml
    feature_type: cqt
    cqt_eps: 1e-3
    # Multiplies the gradient of each synth parameter (the model's outputs) by
    # (curvature / geometric mean) ** -curvature_alpha, with the curvatures saved by
    # scripts/theta_curvature.py (path relative to the repository root)
    use_curvature: false
    curvature_path: data/curvatures/mss_rev_724k_adamw_1e-4t5__mars_808_n681_b8_micro__seed_420__init.json
    curvature_alpha: 0.25

# Computed on the validation and test sets (on the synthesized audio vs. the target)
# whatever the training loss above, and logged as val/<name> and test/<name>
metrics:
  mss: mss_meso_log_jax.yml
  mss_rev: mss_revisited_jax.yml

optimizer: adam_w_1e-4_jax.yml

# torch.optim.lr_scheduler.LinearLR, stepped once per epoch like in Lightning
lr_scheduler:
  start_factor: 1.0        # multiplier for initial lr (so 1.0 → 1e-4)
  end_factor: 0.1          # multiplier for final lr (so 0.1 → 1e-5)
  total_iters: 50          # number of epochs
