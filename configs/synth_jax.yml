# JAX version of synth.yml (same init_args). The PRNG key for the noise buffer is
# derived from the run seed by the trainer.
class_path: src.experiments.synths_jax.DDSP808Synth
init_args:
  sr: 44100
  num_samples: 44100
  buffer_noise: true
  buffer_size: 44100
  J_cqt: 9
  Q_cqt: 12
  hop_len: 256
  delta_min: -2048
  delta_max: 2048
